[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = []
solc = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 10000
# No metadata hash in the bytecode: the CREATE2 address depends only on the code,
# not on comments or file paths, so PREFLIGHT_PAYOUT_ADDRESS stays stable.
bytecode_hash = "none"
cbor_metadata = false
