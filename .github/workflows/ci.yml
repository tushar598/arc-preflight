name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w arc-preflight
      - run: npm run test -w arc-preflight
      - run: npm run build -w arc-preflight
      - name: Smoke-test the CLI bundle (offline, --help only)
        run: node packages/arc-preflight/dist/bin.js --help
      - name: Verify publish contents
        run: npm pack -w arc-preflight --dry-run 2>&1 | tail -40

  app:
    name: Demo app — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w arc-preflight
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build:app

  contracts:
    name: PreflightPayout — forge test, address pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge fmt --check contracts/src contracts/test
      - run: forge test --root contracts -vv
      - name: CREATE2 address matches PREFLIGHT_PAYOUT_ADDRESS in the SDK
        run: |
          INIT=$(jq -r .bytecode.object contracts/out/PreflightPayout.sol/PreflightPayout.json)
          ADDR=$(cast create2 --deployer 0x4e59b44847b379578588920cA78FbF26c0B4956C \
            --salt "$(cast keccak arc-preflight.PreflightPayout.v1)" --init-code "$INIT" | grep -oE '\b0x[0-9a-fA-F]{40}\b' | head -1)
          echo "computed $ADDR"
          grep -q "$ADDR" packages/arc-preflight/src/constants.ts || {
            echo "::error::Contract bytecode changed: update PREFLIGHT_PAYOUT_ADDRESS to $ADDR (and redeploy)"; exit 1; }

  live:
    name: SDK — live Arc Testnet (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
      - run: npm ci
      - run: forge build --root contracts
      - run: npm run test:live -w arc-preflight
