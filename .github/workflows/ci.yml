name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    name: SDK — typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck -w arc-preflight
      - run: npm run test -w arc-preflight
      - run: npm run build -w arc-preflight
      - name: Smoke-test the CLI bundle (offline, --help only)
        run: node packages/arc-preflight/dist/bin.js --help
      - name: Verify publish contents
        run: npm pack -w arc-preflight --dry-run 2>&1 | tail -40

  app:
    name: Demo app — lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w arc-preflight
      - run: npm run lint
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run build:app

  live:
    name: SDK — live Arc Testnet (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:live -w arc-preflight
